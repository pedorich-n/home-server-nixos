- platform: smartir
  name: LDK AC
  unique_id: ldk_ac
  device_code: 17000
  controller_data: remote.ldk_ir_remote_1
  temperature_sensor: sensor.ldk_temperature_humidity_1_temperature
  humidity_sensor: sensor.ldk_temperature_humidity_1_humidity
  power_sensor: binary_sensor.ldk_ac_running
  power_sensor_restore_state: true
  delay: 0.2

- platform: smartir
  name: Bedroom AC
  unique_id: bedroom_ac
  device_code: 17000
  controller_data: remote.bedroom_ir_remote_1
  temperature_sensor: sensor.bedroom_temperature_humidity_1_temperature
  humidity_sensor: sensor.bedroom_temperature_humidity_1_humidity
  power_sensor: binary_sensor.bedroom_ac_running
  power_sensor_restore_state: true
  delay: 0.2
