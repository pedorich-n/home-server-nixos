- id: ldk_ac_remote
  alias: "LDK remote - AC"
  use_blueprint:
    path: local/zigbee2mqtt_tuya_ts0043_3_button_remote.yaml
    input:
      remote: "1684187377f192a605e0a293e9719ebf" # LDK Remote 1
      button_1_single:
        - action: climate.toggle
          target:
            entity_id: climate.ldk_ac
      button_2_single:
        - action: climate.set_temperature
          target:
            entity_id: climate.ldk_ac
          data:
            temperature: "{{ [ (state_attr('climate.ldk_ac', 'temperature') | float(24)) + 1, 30 ] | min }}"
      button_3_single:
        - action: climate.set_temperature
          target:
            entity_id: climate.ldk_ac
          data:
            temperature: "{{ [ (state_attr('climate.ldk_ac', 'temperature') | float(24)) - 1, 20 ] | max }}"

