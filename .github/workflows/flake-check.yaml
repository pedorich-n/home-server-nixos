name: Nix Flake Check
on:
  push:
  workflow_dispatch:

jobs:
  nix-flake-check:
    uses: pedorich-n/github-workflows/.github/workflows/flake-check.yaml@467bf6cfc2673d3f3a2fe015d8da8d80f7cd84d8 # main
    with:
      timeout_minutes: 20
      app_client_id: ${{ vars.APP_CLIENT_ID }}
      app_owner: ${{ github.repository_owner }}
      nix_version: "2.29.4"
    secrets:
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
