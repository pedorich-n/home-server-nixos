name: Update flake.lock
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 10 1 * *"

jobs:
  update-flake-lock:
    uses: pedorich-n/github-workflows/.github/workflows/update-flake-lock.yaml@37c055d3c6b1062846d5f9a45cf845f202e63b22 # main
    with:
      app_client_id: ${{ vars.APP_CLIENT_ID }}
      app_owner: ${{ github.repository_owner }}
    secrets:
      app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
